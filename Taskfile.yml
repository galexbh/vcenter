# Atajos para personas (https://taskfile.dev): `task` lista las tareas.
#
# Solo cubre operaciones que no modifican vCenter: preparación (setup, install, credential, env,
# vcsim), reportes, revisión de hosts, auditoría, tendencias, demo, pruebas y documentación.
# Las escrituras y la provisión no tienen atajo a propósito: siguen el flujo con validación y
# aprobación (/vm-create en Claude Code).
# Claude no usa estas tareas: invoca los scripts directamente para que las guardas vean cada operación.
#
# Variables: ENV (entorno) o FROM (carpeta de reports/ ya recolectada), TYPE, SCOPE, CLUSTER, ACCOUNT.
# Parámetros adicionales del script, después de `--`:  task report ENV=prod -- -Format csv
version: '3'

vars:
  PS: pwsh -NoProfile -NonInteractive -Command

tasks:
  default:
    desc: Lista las tareas disponibles
    silent: true
    cmds:
      - '{{.TASK_EXE}} --list'

  # --- Instalación y conexión ---------------------------------------------------

  setup:
    desc: Prepara un clon nuevo (activa el control pre-commit y crea la configuración desde el ejemplo)
    cmds:
      - git config core.hooksPath .githooks
      - task: setup:config

  setup:config:
    internal: true
    status:
      - test -f config/environments.json
    cmds:
      - pwsh -NoProfile -Command "Copy-Item config/environments.example.json config/environments.json"
      - echo "Creado config/environments.json a partir del ejemplo; ajusta url, datacenter, mode y caCerts."

  install:
    desc: Instala la versión estable más alta de govc en tools/ (-- -WithVcsim, -- -Version vX.Y.Z)
    cmds:
      - '{{.PS}} "./scripts/Install-Govc.ps1 {{.CLI_ARGS}}"'

  env:
    desc: Prueba la conexión a un entorno (ENV=lab)
    requires:
      vars: [ENV]
    cmds:
      - pwsh -NoProfile -File scripts/govc.ps1 -Env '{{.ENV}}' about

  # La contraseña la pide cmdkey por consola: nunca pasa por argumentos ni por el Taskfile.
  # Sin -Remove ni parámetros libres; para borrar una credencial se usa el script directamente.
  credential:
    desc: Registra o reemplaza la credencial de un entorno en Credential Manager (ENV=lab, ACCOUNT=<usuario> opcional)
    interactive: true
    requires: { vars: [ENV] }
    preconditions:
      - sh: '[ -z "$CLAUDECODE" ]'
        msg: 'La credencial la registra una persona en su propia terminal, no Claude.'
    cmds:
      - pwsh -NoProfile -File scripts/Set-GovcCredential.ps1 -Env '{{.ENV}}' {{if .ACCOUNT}}-UserName '{{.ACCOUNT}}'{{end}}

  vcsim:
    desc: Inicia el simulador de vCenter en https://127.0.0.1:8989/sdk (instalar con task install -- -WithVcsim)
    preconditions:
      - sh: test -f tools/vcsim.exe
        msg: 'vcsim no está instalado: task install -- -WithVcsim'
    cmds:
      - ./tools/vcsim.exe -l 127.0.0.1:8989

  # --- Reportes y análisis (solo lectura) -----------------------------------------
  # SRC: entorno en vivo (-Env) o datos ya recolectados (-FromRaw), sin volver a consultar vCenter.

  report:
    desc: Reporte HTML/Markdown (CSV con -- -Format csv) en reports/ (ENV=prod o FROM=<carpeta>; TYPE=all|inventory|snapshots|capacity|health)
    vars:
      TYPE: '{{.TYPE | default "all"}}'
      SRC: '{{if .FROM}}-FromRaw ''{{.FROM}}''{{else}}-Env ''{{.ENV}}''{{end}}'
    requires:
      vars:
        - name: TYPE
          enum: [all, inventory, snapshots, capacity, health]
    preconditions:
      - sh: '[ -n "{{.ENV}}{{.FROM}}" ]'
        msg: 'Indica ENV=<entorno> o FROM=<carpeta en reports/>'
    cmds:
      - '{{.PS}} "./scripts/New-Report.ps1 {{.SRC}} -Type {{.TYPE}} {{.CLI_ARGS}}"'

  inventory:
    desc: Reporte de inventario (ENV=prod o FROM=<carpeta>)
    cmds:
      - task: report
        vars: { ENV: '{{.ENV}}', FROM: '{{.FROM}}', TYPE: inventory }

  health:
    desc: Chequeo de salud con hallazgos priorizados (ENV=prod o FROM=<carpeta>)
    cmds:
      - task: report
        vars: { ENV: '{{.ENV}}', FROM: '{{.FROM}}', TYPE: health }

  capacity:
    desc: Capacidad por clúster y datastores (ENV=prod o FROM=<carpeta>)
    cmds:
      - task: report
        vars: { ENV: '{{.ENV}}', FROM: '{{.FROM}}', TYPE: capacity }

  snapshots:
    desc: Snapshots por antigüedad (ENV=prod o FROM=<carpeta>; umbral con -- -SnapshotWarnDays 3)
    cmds:
      - task: report
        vars: { ENV: '{{.ENV}}', FROM: '{{.FROM}}', TYPE: snapshots }

  host-check:
    desc: Revisión esxcli por host y detección de diferencias (ENV=prod CLUSTER=CL-PROD-01, o FROM=<carpeta>; CLUSTER solo con ENV)
    vars:
      SRC: '{{if .FROM}}-FromRaw ''{{.FROM}}''{{else}}-Env ''{{.ENV}}''{{end}}'
    preconditions:
      - sh: '[ -n "{{.ENV}}{{.FROM}}" ]'
        msg: 'Indica ENV=<entorno> o FROM=<carpeta en reports/>'
    cmds:
      - '{{.PS}} "./scripts/Invoke-HostCheck.ps1 {{.SRC}} {{if .CLUSTER}}-Cluster ''{{.CLUSTER}}''{{end}} {{.CLI_ARGS}}"'

  # Sin SCOPE, el script usa full con ENV y conserva el alcance guardado con FROM.
  audit:
    desc: Auditoría técnica con informe formal (ENV=prod o FROM=<carpeta>; SCOPE=full|security|capacity; CLUSTER solo con ENV)
    vars:
      SRC: '{{if .FROM}}-FromRaw ''{{.FROM}}''{{else}}-Env ''{{.ENV}}''{{end}}'
    preconditions:
      - sh: '[ -n "{{.ENV}}{{.FROM}}" ]'
        msg: 'Indica ENV=<entorno> o FROM=<carpeta en reports/>'
      - sh: 'case "{{.SCOPE}}" in ""|full|security|capacity) ;; *) exit 1;; esac'
        msg: 'SCOPE admite full, security o capacity'
    cmds:
      - '{{.PS}} "./scripts/Invoke-Audit.ps1 {{.SRC}} {{if .SCOPE}}-Scope {{.SCOPE}}{{end}} {{if .CLUSTER}}-Cluster ''{{.CLUSTER}}''{{end}} {{.CLI_ARGS}}"'

  trend:
    desc: Tendencias entre las dos corridas más recientes (ENV=prod)
    requires: { vars: [ENV] }
    cmds:
      - '{{.PS}} "./scripts/Compare-Report.ps1 -Env ''{{.ENV}}'' {{.CLI_ARGS}}"'

  demo:
    desc: Genera datos ficticios con inventario y hosts (HTML) y auditoría (HTML y MD) en reports/demo/ (sin vCenter)
    vars:
      OUT:
        sh: pwsh -NoProfile -Command "'reports/demo/' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-auditoria'"
    cmds:
      - '{{.PS}} "./scripts/New-DemoData.ps1 -OutDir ''{{.OUT}}'' {{.CLI_ARGS}}" > /dev/null'
      - '{{.PS}} "./scripts/Invoke-Audit.ps1 -FromRaw ''{{.OUT}}''" > /dev/null'
      - echo "Datos y reportes en {{.OUT}} (inventario/, hosts/ y auditoria.html)."
      - echo "Otros reportes sobre estos datos, p. ej. task health FROM={{.OUT}}/inventario"

  # --- Pruebas ---------------------------------------------------------------------

  test:
    desc: Pruebas de guardas y de reportes
    cmds:
      - task: test:guards
      - task: test:reports

  test:guards:
    desc: Pruebas de clasificación de operaciones y del hook
    cmds:
      - pwsh -NoProfile -File scripts/Test-Guards.ps1

  test:reports:
    desc: Pruebas de regresión de reportes, CSV, hosts, auditoría y tendencias
    cmds:
      - pwsh -NoProfile -File scripts/Test-Reports.ps1

  test:log:
    desc: Verifica la integridad de la bitácora de auditoría
    cmds:
      - pwsh -NoProfile -File scripts/Test-AuditLog.ps1

  # --- Documentación ---------------------------------------------------------------

  docs:install:
    internal: true
    dir: docs
    status:
      - test -d node_modules
    cmds:
      - npm ci

  docs:
    desc: Servidor local de la documentación (http://localhost:4321/vcenter/)
    dir: docs
    deps: [docs:install]
    cmds:
      - npm run dev

  docs:build:
    desc: Compila la documentación en docs/dist/
    dir: docs
    deps: [docs:install]
    cmds:
      - npm run build
